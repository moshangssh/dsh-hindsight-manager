name: Check manager

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
      - name: Install the tested DSH host
        run: |
          node --input-type=module <<'JS'
          import { execFileSync } from 'node:child_process';
          import { readFileSync } from 'node:fs';
          const { engines } = JSON.parse(readFileSync('package.json'));
          execFileSync('npm', ['install', '--global', `@deepseek-ai/dsh@${engines.dsh}`], { stdio: 'inherit' });
          JS
      - name: Check and test the manager
        run: |
          npm run check
          npm test
