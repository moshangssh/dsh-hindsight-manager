name: Check manager

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
      - name: Install the tested DSH host
        run: |
          node --input-type=module <<'JS'
          import { execFileSync } from 'node:child_process';
          import { readFileSync } from 'node:fs';
          const { engines } = JSON.parse(readFileSync('package.json'));
          execFileSync('npm', ['install', '--global', `@deepseek-ai/dsh@${engines.dsh}`], { stdio: 'inherit' });
          JS
      - name: Check and test the manager
        run: |
          npm run check
          npm test
      - name: Verify the supported runtime delivery
        run: |
          node --input-type=module <<'JS'
          import { execFileSync } from 'node:child_process';
          import { mkdtempSync, readFileSync } from 'node:fs';
          import { tmpdir } from 'node:os';
          import { join, resolve } from 'node:path';
          const { supportedEnhancement: { upstream } } = JSON.parse(readFileSync('manager.config.json'));
          const directory = mkdtempSync(join(tmpdir(), 'hindsight-runtime-ci-'));
          const packed = JSON.parse(execFileSync('npm', ['pack', `${upstream.name}@${upstream.version}`,
            '--ignore-scripts', '--json', '--pack-destination', directory], { encoding: 'utf8' }));
          execFileSync('tar', ['-xzf', join(directory, packed[0].filename), '-C', directory]);
          const runtime = join(directory, 'package');
          execFileSync('git', ['-C', runtime, 'apply', resolve('runtime-patches', upstream.version, 'delivery.patch')]);
          execFileSync('npm', ['--prefix', runtime, 'run', 'test:dsh'], { stdio: 'inherit' });
          execFileSync('npm', ['run', 'test:runtime', '--', runtime], { stdio: 'inherit' });
          JS
